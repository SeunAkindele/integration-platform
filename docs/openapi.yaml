openapi: 3.0.3
info:
  title: Integration Platform API
  description: |
    Webhook ingestion API for the Integration Platform.

    ## Flow

    1. External providers (GitHub, Stripe, Slack) send webhooks to `POST /webhooks/{provider}`
    2. The API Gateway validates the request, extracts the signature header, and publishes the event to NATS JetStream
    3. The Webhook Processor consumes the event, verifies the signature, and persists it into PostgreSQL
    4. The event status transitions from `received` → `validated` (or `failed`)

    ## Signature Headers

    | Provider | Header |
    |----------|--------|
    | GitHub   | `x-hub-signature-256` |
    | Stripe   | `stripe-signature` |
    | Slack    | `x-slack-signature` |
  version: 1.0.0
  contact:
    name: Oriade

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Webhooks
    description: Webhook ingestion endpoints

paths:
  /webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      tags: [Webhooks]
      summary: Receive a GitHub webhook
      description: |
        Accepts a GitHub webhook event, publishes it to the message broker for
        asynchronous processing (signature verification, persistence).
      parameters:
        - $ref: "#/components/parameters/GitHubSignatureHeader"
        - $ref: "#/components/parameters/GitHubEventHeader"
        - $ref: "#/components/parameters/GitHubDeliveryHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubPushEvent"
            examples:
              push:
                summary: Push event
                value:
                  ref: refs/heads/main
                  before: "6113728f27ae82c7b1a177c8d03f9e96e0adf246"
                  after: "0d1a26e67d8f5eaf1f6ba5c57fc3c7d91ac0fd1c"
                  repository:
                    id: 123456789
                    name: integration-platform
                    full_name: oriade/integration-platform
                    private: false
                    html_url: https://github.com/oriade/integration-platform
                    owner:
                      login: oriade
                      id: 987654
                  pusher:
                    name: oriade
                    email: dev@oriade.io
                  commits:
