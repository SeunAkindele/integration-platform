                    number: 42
                    state: open
                    title: "feat: add stripe adapter"
                    body: "Implements Stripe webhook adapter for payment events"
                    html_url: https://github.com/oriade/integration-platform/pull/42
                    user:
                      login: oriade
                      id: 987654
                    head:
                      ref: feat/stripe-adapter
                      sha: "abc123def456"
                    base:
                      ref: main
                      sha: "789ghi012jkl"
                    created_at: "2026-03-18T09:00:00Z"
